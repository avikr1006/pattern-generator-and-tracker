<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pattern Generator - No Circle</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        .pattern-box {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .pattern-box:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0,0,0,.4);
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

<header class="bg-slate-900 border-b border-slate-800 p-6 shadow-md sticky top-0 z-10">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">

        <div>
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-500">
                Pattern Generator
            </h1>

            <p class="text-slate-400 text-sm mt-1">
                A4 • 35mm Cards • 5×6 • No Circle
            </p>
        </div>

        <div class="flex flex-col sm:flex-row items-center gap-4">

            <div class="flex items-center gap-2 bg-slate-800 p-2 rounded-lg border border-slate-700">

                <label for="dotCount" class="text-sm font-medium text-slate-300">
                    Dots:
                </label>

                <select
                    id="dotCount"
                    class="bg-slate-900 border border-slate-700 text-white text-sm rounded-md p-2 outline-none cursor-pointer"
                >
                    <option value="4" selected>4 Dots</option>
                    <option value="5">5 Dots</option>
                    <option value="6">6 Dots</option>
                    <option value="7">7 Dots</option>
                    <option value="8">8 Dots</option>
                    <option value="9">9 Dots</option>
                </select>
            </div>

            <button
                id="generateBtn"
                class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-medium rounded-lg text-sm shadow-lg"
            >
                Generate Patterns
            </button>

            <button
                id="downloadBtn"
                disabled
                class="px-5 py-2.5 bg-slate-800 text-slate-500 border border-slate-700 font-medium rounded-lg text-sm cursor-not-allowed"
            >
                Download PDF
            </button>

        </div>
    </div>
</header>


<main class="flex-grow p-6 max-w-6xl mx-auto w-full">

    <div id="statusArea" class="mb-6 border-b border-slate-800 pb-4 hidden">

        <h2 class="text-xl font-semibold text-white">
            Generation Results
        </h2>

        <p id="statsText" class="text-slate-400 text-sm mt-1">
            Found 0 patterns.
        </p>

    </div>

    <div
        id="patternGrid"
        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 pb-12"
    ></div>

    <div id="emptyState" class="text-center mt-32 opacity-50">

        <h2 class="text-xl font-medium text-slate-400">
            Ready to Generate
        </h2>

        <p class="text-slate-500 text-sm mt-2">
            Select dots and click Generate Patterns.
        </p>

    </div>

</main>


<div
    id="progressOverlay"
    class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden items-center justify-center"
>

    <div class="bg-slate-900 border border-slate-700 rounded-xl p-8 max-w-md w-full text-center">

        <h3 class="text-xl font-bold text-white mb-2">
            Generating PDF
        </h3>

        <p
            id="progressDesc"
            class="text-slate-400 text-sm mb-6"
        >
            Drawing A4 pattern cards...
        </p>

        <div class="w-full bg-slate-800 rounded-full h-2.5">

            <div
                id="progressBar"
                class="bg-gradient-to-r from-emerald-500 to-cyan-400 h-2.5 rounded-full"
                style="width:0%"
            ></div>

        </div>

        <p
            id="progressPercent"
            class="text-xs text-slate-500 mt-2"
        >
            0%
        </p>

    </div>
</div>


<script>

const PREVIEW_LIMIT = 100;

let generatedSequences = [];


/* =========================================================
   BLOCKING MATRIX
========================================================= */

const blockMatrix =
    Array.from(
        { length: 9 },
        () => Array(9).fill(-1)
    );

blockMatrix[0][2] = 1;
blockMatrix[2][0] = 1;

blockMatrix[3][5] = 4;
blockMatrix[5][3] = 4;

blockMatrix[6][8] = 7;
blockMatrix[8][6] = 7;

blockMatrix[0][6] = 3;
blockMatrix[6][0] = 3;

blockMatrix[1][7] = 4;
blockMatrix[7][1] = 4;

blockMatrix[2][8] = 5;
blockMatrix[8][2] = 5;

blockMatrix[0][8] = 4;
blockMatrix[8][0] = 4;

blockMatrix[2][6] = 4;
blockMatrix[6][2] = 4;


/* =========================================================
   DOM
========================================================= */

const generateBtn =
    document.getElementById("generateBtn");

const downloadBtn =
    document.getElementById("downloadBtn");

const dotCount =
    document.getElementById("dotCount");

const patternGrid =
    document.getElementById("patternGrid");

const statusArea =
    document.getElementById("statusArea");

const statsText =
    document.getElementById("statsText");

const emptyState =
    document.getElementById("emptyState");

const progressOverlay =
    document.getElementById("progressOverlay");

const progressBar =
    document.getElementById("progressBar");

const progressPercent =
    document.getElementById("progressPercent");


/* =========================================================
   GENERATE PATTERNS
========================================================= */

function generatePatterns(length) {

    const result = [];

    function dfs(current, visited, path) {

        if (path.length === length) {

            result.push([...path]);

            return;
        }

        for (let next = 0; next < 9; next++) {

            if (visited[next]) {
                continue;
            }

            const blocking =
                blockMatrix[current][next];

            if (
                blocking === -1 ||
                visited[blocking]
            ) {

                visited[next] = true;

                path.push(next);

                dfs(
                    next,
                    visited,
                    path
                );

                path.pop();

                visited[next] = false;
            }
        }
    }

    for (let start = 0; start < 9; start++) {

        const visited =
            new Array(9).fill(false);

        visited[start] = true;

        dfs(
            start,
            visited,
            [start]
        );
    }

    return result;
}


/* =========================================================
   PREVIEW
========================================================= */

function createSVG(sequence) {

    const points = [
        [25,35],[50,35],[75,35],
        [25,60],[50,60],[75,60],
        [25,85],[50,85],[75,85]
    ];

    let svg = `
        <svg
            viewBox="0 0 100 100"
            class="w-full h-full"
        >
    `;

    for (let i = 0; i < 9; i++) {

        svg += `
            <circle
                cx="${points[i][0]}"
                cy="${points[i][1]}"
                r="3"
                fill="#475569"
            />
        `;
    }

    let path = `
        M
        ${points[sequence[0]][0]}
        ${points[sequence[0]][1]}
    `;

    for (let i = 1; i < sequence.length; i++) {

        path += `
            L
            ${points[sequence[i]][0]}
            ${points[sequence[i]][1]}
        `;
    }

    svg += `
        <path
            d="${path}"
            fill="none"
            stroke="#0ea5e9"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
        />
    `;

    for (let i = 1; i < sequence.length; i++) {

        const p =
            points[sequence[i]];

        svg += `
            <circle
                cx="${p[0]}"
                cy="${p[1]}"
                r="4.5"
                fill="#38bdf8"
            />
        `;
    }

    const start =
        points[sequence[0]];

    svg += `
        <circle
            cx="${start[0]}"
            cy="${start[1]}"
            r="5.5"
            fill="#ef4444"
        />
    `;

    return svg + "</svg>";
}


function showPreview() {

    patternGrid.innerHTML = "";

    const limit =
        Math.min(
            generatedSequences.length,
            PREVIEW_LIMIT
        );

    for (let i = 0; i < limit; i++) {

        const card =
            document.createElement("div");

        card.className =
            "pattern-box bg-[#1e293b] rounded-xl aspect-square relative overflow-hidden border border-slate-700/50";

        card.innerHTML =
            createSVG(
                generatedSequences[i]
            );

        const number =
            document.createElement("span");

        number.className =
            "absolute top-3 left-3 text-xs text-[#22c55e] font-mono font-bold";

        number.textContent =
            `#${i + 1}`;

        card.appendChild(number);

        patternGrid.appendChild(card);
    }
}


/* =========================================================
   GENERATE
========================================================= */

generateBtn.addEventListener(
    "click",
    () => {

        const count =
            Number(dotCount.value);

        emptyState.style.display =
            "none";

        statusArea.classList.remove(
            "hidden"
        );

        statsText.textContent =
            "Calculating patterns...";

        generateBtn.disabled = true;

        setTimeout(() => {

            const start =
                performance.now();

            generatedSequences =
                generatePatterns(count);

            const time =
                performance.now() - start;

            statsText.innerHTML =
                `
                Found
                <strong class="text-white">
                    ${generatedSequences.length.toLocaleString()}
                </strong>
                valid patterns in
                ${time.toFixed(2)}ms.
                `;

            showPreview();

            generateBtn.disabled =
                false;

            downloadBtn.disabled =
                false;

            downloadBtn.className =
                `
                px-5 py-2.5
                bg-gradient-to-r
                from-emerald-600 to-teal-600
                text-white font-medium
                rounded-lg text-sm
                cursor-pointer
                `;

        }, 50);
    }
);


/* =========================================================
   PDF
========================================================= */

downloadBtn.addEventListener(
    "click",
    async () => {

        if (!generatedSequences.length) {
            return;
        }

        progressOverlay.classList.remove(
            "hidden"
        );

        progressOverlay.classList.add(
            "flex"
        );

        progressBar.style.width =
            "0%";

        progressPercent.textContent =
            "0%";

        await new Promise(
            r => setTimeout(r, 100)
        );


        try {

            const {
                jsPDF
            } = window.jspdf;


            /* =========================================
               PAGE
            ========================================= */

            const pageWidth = 210;
            const pageHeight = 297;


            /* =========================================
               LAYOUT
            ========================================= */

            const columns = 5;
            const rows = 6;

            const cardSize = 35;

            const horizontalGap = 5;

            const verticalGap = 13.5;

            const leftMargin = 7.5;

            const topMargin = 3;

            const itemsPerPage =
                columns * rows;


            /* =========================================
               COLORS
            ========================================= */

            const PAGE_BG =
                [15, 23, 42];

            const CARD_BG =
                [30, 41, 59];

            const NUMBER =
                [34, 197, 94];

            const LINE =
                [14, 165, 233];

            const SELECTED =
                [56, 189, 248];

            const START =
                [239, 68, 68];

            const BASE =
                [71, 85, 105];


            /* =========================================
               PDF
            ========================================= */

            const doc =
                new jsPDF({
                    orientation: "portrait",
                    unit: "mm",
                    format: "a4",
                    compress: true
                });


            function paintPage() {

                doc.setFillColor(
                    ...PAGE_BG
                );

                doc.rect(
                    0,
                    0,
                    pageWidth,
                    pageHeight,
                    "F"
                );
            }


            /* =========================================
               CARD
            ========================================= */

            function drawCard(
                sequence,
                number,
                x,
                y
            ) {

                doc.setFillColor(
                    ...CARD_BG
                );

                doc.roundedRect(
                    x,
                    y,
                    cardSize,
                    cardSize,
                    2.2,
                    2.2,
                    "F"
                );


                /* Number */

                doc.setFont(
                    "helvetica",
                    "bold"
                );

                doc.setFontSize(
                    5.5
                );

                doc.setTextColor(
                    ...NUMBER
                );

                doc.text(
                    `#${number}`,
                    x + 2.5,
                    y + 4.5
                );


                /* Grid */

                const spacing = 9.5;

                const offset =
                    (
                        cardSize -
                        spacing * 2
                    ) / 2;

                const points = [];


                for (
                    let row = 0;
                    row < 3;
                    row++
                ) {

                    for (
                        let col = 0;
                        col < 3;
                        col++
                    ) {

                        points.push([
                            x +
                            offset +
                            col * spacing,

                            y +
                            offset +
                            row * spacing
                        ]);
                    }
                }


                /* Base dots */

                doc.setFillColor(
                    ...BASE
                );

                for (let i = 0; i < 9; i++) {

                    doc.circle(
                        points[i][0],
                        points[i][1],
                        1.15,
                        "F"
                    );
                }


                /* Lines */

                doc.setDrawColor(
                    ...LINE
                );

                doc.setLineWidth(
                    0.9
                );

                doc.setLineCap(
                    "round"
                );

                doc.setLineJoin(
                    "round"
                );


                for (
                    let i = 0;
                    i < sequence.length - 1;
                    i++
                ) {

                    const a =
                        points[
                            sequence[i]
                        ];

                    const b =
                        points[
                            sequence[i + 1]
                        ];

                    doc.line(
                        a[0],
                        a[1],
                        b[0],
                        b[1]
                    );
                }


                /* Selected dots */

                doc.setFillColor(
                    ...SELECTED
                );

                for (
                    let i = 1;
                    i < sequence.length;
                    i++
                ) {

                    const p =
                        points[
                            sequence[i]
                        ];

                    doc.circle(
                        p[0],
                        p[1],
                        1.55,
                        "F"
                    );
                }


                /* Start dot */

                const start =
                    points[
                        sequence[0]
                    ];

                doc.setFillColor(
                    ...START
                );

                doc.circle(
                    start[0],
                    start[1],
                    1.9,
                    "F"
                );
            }


            /* First page */

            paintPage();


            /* =========================================
               DRAW PATTERNS
            ========================================= */

            for (
                let i = 0;
                i < generatedSequences.length;
                i++
            ) {

                if (
                    i > 0 &&
                    i % itemsPerPage === 0
                ) {

                    doc.addPage(
                        "a4",
                        "portrait"
                    );

                    paintPage();
                }


                const local =
                    i % itemsPerPage;

                const row =
                    Math.floor(
                        local / columns
                    );

                const col =
                    local % columns;


                const x =
                    leftMargin +
                    col *
                    (
                        cardSize +
                        horizontalGap
                    );


                const y =
                    topMargin +
                    row *
                    (
                        cardSize +
                        verticalGap
                    );


                drawCard(
                    generatedSequences[i],
                    i + 1,
                    x,
                    y
                );


                if (
                    i % 100 === 0 ||
                    i ===
                    generatedSequences.length - 1
                ) {

                    const percent =
                        Math.round(
                            (
                                (i + 1) /
                                generatedSequences.length
                            ) * 100
                        );

                    progressBar.style.width =
                        `${percent}%`;

                    progressPercent.textContent =
                        `${percent}%`;

                    await new Promise(
                        r => setTimeout(r, 0)
                    );
                }
            }


            /* Save */

            const dots =
                dotCount.value;

            doc.save(
                `A4-Pattern-Layout-${dots}Dots-No-Circle.pdf`
            );


        } catch (error) {

            console.error(
                "PDF Error:",
                error
            );

            alert(
                "PDF generation failed. Check console."
            );

        } finally {

            progressOverlay.classList.add(
                "hidden"
            );

            progressOverlay.classList.remove(
                "flex"
            );
        }
    }
);

</script>

</body>
</html>
